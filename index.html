<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><title>Marcos Training</title><link rel='manifest' href='manifest.json'><style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#166534}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}header{position:sticky;top:0;background:rgba(244,245,247,.94);backdrop-filter:blur(10px);padding:18px 16px 12px;border-bottom:1px solid var(--line);z-index:4}h1{font-size:22px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:13px}.wrap{max-width:720px;margin:auto;padding:14px 14px 90px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:700}.tab.active{background:var(--ink);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 2px #00000008}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.exercise h3{margin:0;font-size:17px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.sets{margin-top:12px}.setrow{display:grid;grid-template-columns:30px 1fr 1fr 1fr 38px;gap:7px;align-items:center;margin:7px 0}.setrow input{width:100%;padding:10px 6px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:center;background:#fafafa}.head{font-size:11px;color:var(--muted);text-align:center}.check{border:0;border-radius:10px;height:39px;background:#e5e7eb;font-size:18px}.check.done{background:#dcfce7;color:var(--ok)}button.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:16px}button.secondary{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.metric b{display:block;font-size:20px}.metric span{font-size:11px;color:var(--muted)}.hint{font-size:13px;color:var(--muted);line-height:1.4}.progress{font-size:12px;color:var(--ok);font-weight:700;margin-top:7px}.hidden{display:none}.history-item{border-top:1px solid var(--line);padding:10px 0}.history-item:first-child{border-top:0}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}.footer button{flex:1}.danger{color:#991b1b}.timer{font-variant-numeric:tabular-nums;font-size:18px;font-weight:800}small{color:var(--muted)}
</style></head><body><header><div class='row'><div><h1>Marcos Training</h1><p>Hipertrofia · progreso &gt; agotamiento</p></div><div id='timer' class='timer'>00:00</div></div></header><main class='wrap'><div class='tabs' id='tabs'></div><section id='train'></section><section id='history' class='hidden'></section></main><div class='footer'><button class='secondary' id='historyBtn'>Historial</button><button class='primary' id='finishBtn'>Finalizar entrenamiento</button></div><script>
const routine=[
{day:'Día 1',name:'Pecho + Tríceps',ex:[['Press inclinado Smith',3,'6–10',['2','1','1'],'2½–3 min'],['Press declinado mancuernas',3,'8–12',['2','1','1'],'2–3 min'],['Aperturas en polea',3,'10–15',['2','1','0–1'],'90 s'],['Press francés',3,'8–12',['2','1','1'],'2 min'],['Tríceps polea tras nuca',2,'10–15',['1','0–1'],'90 s']]},
{day:'Día 2',name:'Espalda + Bíceps',ex:[['Dorsalera agarre abierto',3,'6–10',['2','1','1'],'2–3 min'],['Remo polea baja',3,'8–12',['2','1','1'],'2–3 min'],['Remo unilateral',3,'8–12',['2','1','0–1'],'2 min'],['Pullover polea',2,'12–15',['1','0–1'],'90 s'],['Vuelos posteriores',3,'12–20',['2','1','0–1'],'60–90 s'],['Curl bíceps barra',3,'8–12',['2','1','1'],'90–120 s'],['Curl inclinado 45°',2,'10–15',['1','0–1'],'90 s']]},
{day:'Día 3',name:'Piernas',ex:[['Prensa 45°',3,'8–12',['3','2','1'],'2½–3 min'],['Sentadilla Hack',3,'8–12',['2','1','1'],'2½–3 min'],['Femoral camilla',3,'10–15',['2','1','0–1'],'90–120 s'],['Aductores máquina',2,'10–15',['1','0–1'],'90 s'],['Gemelos parado',3,'8–12',['2','1','0–1'],'90 s'],['Gemelos sentado',2,'12–15',['1','0–1'],'90 s']]},
{day:'Día 4',name:'Pecho + Tríceps',ex:[['Press máquina Hammer',3,'8–12',['2','1','1'],'2–3 min'],['Press plano mancuernas',3,'8–12',['2','1','1'],'2–3 min'],['Fly deck',2,'12–15',['1','0'],'90 s'],['Fondos en máquina',2,'8–12',['1','0–1'],'90–120 s'],['Tríceps soga',3,'10–15',['2','1','0'],'90 s']]},
{day:'Día 5',name:'Hombros + Bíceps',ex:[['Press hombros máquina',3,'6–10',['2','1','1'],'2–3 min'],['Elevaciones laterales unilateral',4,'10–15',['2','1','1','0–1'],'60–90 s'],['Face pulls',3,'12–20',['2','1','0–1'],'60–90 s'],['Curl bíceps spider',3,'8–12',['2','1','0–1'],'90–120 s'],['Curl Scott unilateral mancuerna',2,'10–15',['1','0–1'],'90 s']]}
];
let active=+(localStorage.activeDay||0), start=Date.now(), viewingHistory=false;
const $=s=>document.querySelector(s), tabs=$('#tabs'), train=$('#train'), hist=$('#history');
function history(){return JSON.parse(localStorage.workouts||'[]')} function saveHistory(h){localStorage.workouts=JSON.stringify(h)}
function lastFor(name){for(const w of history()) for(const e of w.exercises||[]) if(e.name===name) return e; return null}
function renderTabs(){tabs.innerHTML=routine.map((d,i)=>`<button class='tab ${i===active?'active':''}' onclick='selectDay(${i})'>${d.day}</button>`).join('')}
function selectDay(i){active=i;localStorage.activeDay=i;viewingHistory=false;hist.classList.add('hidden');train.classList.remove('hidden');renderTabs();render()}
function render(){let d=routine[active];let html=`<div class='card'><div class='row'><div><b>${d.day} — ${d.name}</b><div class='hint'>Objetivo: 60–75 min · respetar RIR · sin ejercicios extra</div></div><button class='secondary' onclick='resetSession()'>Reiniciar</button></div></div>`;
d.ex.forEach((e,ei)=>{let last=lastFor(e[0]);html+=`<div class='card exercise'><h3>${e[0]}</h3><div class='meta'>${e[1]} series · ${e[2]} reps · descanso ${e[4]}</div>${last?`<div class='progress'>Última vez: ${last.sets.map(s=>`${s.kg||'-'}kg×${s.reps||'-'}`).join(' · ')}</div>`:''}<div class='sets'><div class='setrow head'><div>#</div><div>KG</div><div>REPS</div><div>RIR</div><div>✓</div></div>`;for(let s=0;s<e[1];s++){let key=`draft-${active}-${ei}-${s}`,v=JSON.parse(localStorage.getItem(key)||'{}');html+=`<div class='setrow'><div>${s+1}</div><input inputmode='decimal' placeholder='kg' value='${v.kg||''}' oninput="upd('${key}','kg',this.value)"><input inputmode='numeric' placeholder='reps' value='${v.reps||''}' oninput="upd('${key}','reps',this.value)"><input inputmode='decimal' placeholder='${e[3][s]}' value='${v.rir||''}' oninput="upd('${key}','rir',this.value)"><button class='check ${v.done?'done':''}' onclick="done('${key}')">${v.done?'✓':'○'}</button></div>`}html+='</div></div>'});train.innerHTML=html}
window.upd=(k,f,v)=>{let x=JSON.parse(localStorage.getItem(k)||'{}');x[f]=v;localStorage.setItem(k,JSON.stringify(x))};window.done=k=>{let x=JSON.parse(localStorage.getItem(k)||'{}');x.done=!x.done;localStorage.setItem(k,JSON.stringify(x));render()};
window.resetSession=()=>{if(!confirm('¿Borrar los datos cargados de esta sesión?'))return;routine[active].ex.forEach((e,ei)=>{for(let s=0;s<e[1];s++)localStorage.removeItem(`draft-${active}-${ei}-${s}`)});start=Date.now();render()};
function finish(){let d=routine[active],exercises=[],completed=0,total=0;d.ex.forEach((e,ei)=>{let sets=[];for(let s=0;s<e[1];s++){let v=JSON.parse(localStorage.getItem(`draft-${active}-${ei}-${s}`)||'{}');sets.push(v);total++;if(v.done)completed++}exercises.push({name:e[0],sets})});if(!completed&&!confirm('No marcaste series como completadas. ¿Guardar igualmente?'))return;let mins=Math.max(1,Math.round((Date.now()-start)/60000));let h=history();h.unshift({date:new Date().toISOString(),day:d.day,name:d.name,minutes:mins,completed,total,exercises});saveHistory(h);routine[active].ex.forEach((e,ei)=>{for(let s=0;s<e[1];s++)localStorage.removeItem(`draft-${active}-${ei}-${s}`)});alert(`Entrenamiento guardado: ${mins} min · ${completed}/${total} series.`);start=Date.now();render()}
function renderHistory(){let h=history();hist.innerHTML=`<div class='card'><h3 style='margin-top:0'>Historial</h3>${h.length?h.map(w=>`<div class='history-item'><b>${new Date(w.date).toLocaleDateString('es-AR')} · ${w.day} — ${w.name}</b><div class='meta'>${w.minutes} min · ${w.completed}/${w.total} series</div>${w.exercises.map(e=>`<div class='hint' style='margin-top:5px'><b>${e.name}:</b> ${e.sets.filter(s=>s.kg||s.reps).map(s=>`${s.kg||'-'} kg × ${s.reps||'-'} @ RIR ${s.rir||'-'}`).join(' · ')}</div>`).join('')}</div>`).join(''):`<p class='hint'>Todavía no hay entrenamientos guardados.</p>`}</div>`}
$('#finishBtn').onclick=finish;$('#historyBtn').onclick=()=>{viewingHistory=!viewingHistory;if(viewingHistory){train.classList.add('hidden');hist.classList.remove('hidden');renderHistory();$('#historyBtn').textContent='Volver'}else{hist.classList.add('hidden');train.classList.remove('hidden');$('#historyBtn').textContent='Historial'}};
setInterval(()=>{let m=Math.floor((Date.now()-start)/60000),s=Math.floor((Date.now()-start)/1000)%60;$('#timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')},1000);renderTabs();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
