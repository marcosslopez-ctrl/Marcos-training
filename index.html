<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><title>Marcos Training</title><link rel='manifest' href='manifest.json'><style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#166534}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}header{position:sticky;top:0;background:rgba(244,245,247,.94);backdrop-filter:blur(10px);padding:18px 16px 12px;border-bottom:1px solid var(--line);z-index:4}h1{font-size:22px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:13px}.wrap{max-width:720px;margin:auto;padding:14px 14px 90px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:700}.tab.active{background:var(--ink);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 2px #00000008}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.exercise h3{margin:0;font-size:17px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.sets{margin-top:12px}.setrow{display:grid;grid-template-columns:30px 1fr 1fr 1fr 38px;gap:7px;align-items:center;margin:7px 0}.setrow input{width:100%;padding:10px 6px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:center;background:#fafafa}.head{font-size:11px;color:var(--muted);text-align:center}.check{border:0;border-radius:10px;height:39px;background:#e5e7eb;font-size:18px}.check.done{background:#dcfce7;color:var(--ok)}button.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:16px}button.secondary{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.metric b{display:block;font-size:20px}.metric span{font-size:11px;color:var(--muted)}.hint{font-size:13px;color:var(--muted);line-height:1.4}.progress{font-size:12px;color:var(--ok);font-weight:700;margin-top:7px}.hidden{display:none}.history-item{border-top:1px solid var(--line);padding:10px 0}.history-item:first-child{border-top:0}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}.footer button{flex:1}.danger{color:#991b1b}.timer{font-variant-numeric:tabular-nums;font-size:18px;font-weight:800}small{color:var(--muted)}.previous{margin:-2px 0 9px 37px;font-size:12px;color:var(--muted)}.rest{padding:8px 16px;background:#fff;border-bottom:1px solid var(--line)}.rest.ready{background:#dcfce7;color:var(--ok)}.rest small{display:block;font-size:11px;margin-top:3px}
.appnav{display:flex;gap:8px;padding-top:12px;overflow:auto}.appnav button{flex:1}.appnav [aria-selected=true]{background:#111827;color:white}#nutrition input,#nutrition select{max-width:100%;width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;font-size:16px}#nutrition label{display:block;font-size:12px;color:#4b5563}#nutrition .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#nutrition .actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#nutrition h2{font-size:21px}#nutrition h3{font-size:17px}#nutrition progress{width:100%;accent-color:#166534}#nutrition .foodrow{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:8px;align-items:end;margin:12px 0}#nutrition table{width:100%;border-collapse:collapse;font-size:12px}#nutrition td,#nutrition th{padding:10px 3px;text-align:left;border-bottom:1px solid #e5e7eb}#nutrition .nutri-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#nutrition .pill{font-size:12px;color:#166534}#nutrition details{margin:12px 0}#nutrition summary{cursor:pointer;font-weight:700}#nutrition button{min-height:42px}#nutrition .foodrow button{min-width:0}#nutrition .note{border-left:3px solid #9ca3af;padding-left:10px}#nutrition .muted{color:#6b7280}#nutrition .row{flex-wrap:wrap}button{cursor:pointer}button:disabled{cursor:default}input:focus,select:focus,button:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
#extra-form label{display:block;font-size:13px;margin-top:10px}#extra-form input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;font-size:16px}.extra-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}</style></head><body><header><div class='row'><div><h1>Marcos Training</h1><p>Hipertrofia · progreso &gt; agotamiento</p></div><div id='timer' class='timer'>00:00</div></div><div class='meta'>V3.1 · Ejercicios extra</div><nav class="appnav" aria-label="Secciones"><button class="secondary" data-page="training" aria-selected="true">Entrenamiento</button><button class="secondary" data-page="nutrition" aria-selected="false">Nutrición</button></nav></header><div id='rest' class='rest hidden' role='status' aria-live='polite'></div><main class='wrap'><div id='trainingPane'><div class='tabs' id='tabs'></div><section id='train'></section><section id='history' class='hidden'></section></div><section id='nutrition' class='hidden' aria-label='Nutrición'></section></main><div class='footer'><button class='secondary' id='historyBtn'>Historial</button><button class='primary' id='finishBtn'>Finalizar entrenamiento</button></div><script>
const routine=[
{day:'Día 1',name:'Pecho + Tríceps',ex:[['Press inclinado Smith',3,'6–10',['2','1','1'],'2½–3 min'],['Press declinado mancuernas',3,'8–12',['2','1','1'],'2–3 min'],['Aperturas en polea',3,'10–15',['2','1','0–1'],'90 s'],['Press francés',3,'8–12',['2','1','1'],'2 min'],['Tríceps polea tras nuca',2,'10–15',['1','0–1'],'90 s']]},
{day:'Día 2',name:'Espalda + Bíceps',ex:[['Dorsalera agarre abierto',3,'6–10',['2','1','1'],'2–3 min'],['Remo polea baja',3,'8–12',['2','1','1'],'2–3 min'],['Remo unilateral',3,'8–12',['2','1','0–1'],'2 min'],['Pullover polea',2,'12–15',['1','0–1'],'90 s'],['Vuelos posteriores',3,'12–20',['2','1','0–1'],'60–90 s'],['Curl bíceps barra',3,'8–12',['2','1','1'],'90–120 s'],['Curl inclinado 45°',2,'10–15',['1','0–1'],'90 s']]},
{day:'Día 3',name:'Piernas',ex:[['Prensa 45°',3,'8–12',['3','2','1'],'2½–3 min'],['Sentadilla Hack',3,'8–12',['2','1','1'],'2½–3 min'],['Femoral camilla',3,'10–15',['2','1','0–1'],'90–120 s'],['Aductores máquina',2,'10–15',['1','0–1'],'90 s'],['Gemelos parado',3,'8–12',['2','1','0–1'],'90 s'],['Gemelos sentado',2,'12–15',['1','0–1'],'90 s']]},
{day:'Día 4',name:'Pecho + Tríceps',ex:[['Press máquina Hammer',3,'8–12',['2','1','1'],'2–3 min'],['Press plano mancuernas',3,'8–12',['2','1','1'],'2–3 min'],['Fly deck',2,'12–15',['1','0'],'90 s'],['Fondos en máquina',2,'8–12',['1','0–1'],'90–120 s'],['Tríceps soga',3,'10–15',['2','1','0'],'90 s']]},
{day:'Día 5',name:'Hombros + Bíceps',ex:[['Press hombros máquina',3,'6–10',['2','1','1'],'2–3 min'],['Elevaciones laterales unilateral',4,'10–15',['2','1','1','0–1'],'60–90 s'],['Face pulls',3,'12–20',['2','1','0–1'],'60–90 s'],['Curl bíceps spider',3,'8–12',['2','1','0–1'],'90–120 s'],['Curl Scott unilateral mancuerna',2,'10–15',['1','0–1'],'90 s']]}
];
const EXTRA_KEY='marcos-training-extras-v1';
const plannedCounts=routine.map(d=>d.ex.length);
function validExtras(x){return x&&typeof x==='object'&&!Array.isArray(x)&&Object.entries(x).every(([day,list])=>/^[0-4]$/.test(day)&&Array.isArray(list)&&list.length<=30&&list.every(e=>e===null||(Array.isArray(e)&&e.length===5&&typeof e[0]==='string'&&e[0].trim().length>0&&e[0].length<=100&&Number.isInteger(e[1])&&e[1]>=1&&e[1]<=10&&/^\d{1,2}–\d{1,2}$/.test(e[2])&&Number(e[2].split('–')[0])>=1&&Number(e[2].split('–')[1])>=Number(e[2].split('–')[0])&&Number(e[2].split('–')[1])<=99&&Array.isArray(e[3])&&e[3].length===e[1]&&e[3].every(v=>/^(?:[0-9]|10)$/.test(v))&&/^(?:[1-9]\d?|[1-5]\d{2}|600) s$/.test(e[4]))))}
let extras={};
try{const raw=JSON.parse(localStorage.getItem(EXTRA_KEY)||'{}');if(!validExtras(raw))throw Error('Invalid extras');extras=raw}catch(_){alert('No se pudieron cargar los ejercicios extra. Conservá una copia de los datos antes de continuar.');}
function syncExtras(){routine.forEach((d,day)=>{d.ex=d.ex.slice(0,plannedCounts[day]);(extras[day]||[]).forEach(e=>{const item=e?JSON.parse(JSON.stringify(e)):['',0,'1–1',[],'1 s'];item.extra=true;item.removed=!e;d.ex.push(item)})})}
syncExtras();
function extraForm(editable){return `<div class="card"><details><summary style="font-weight:700;cursor:pointer">+ Agregar ejercicio extra</summary><p class="hint">Para esta sesión solamente. Se guardará en el historial como extra. Podés volver a agregarlo con el mismo nombre para consultar su registro anterior.</p>${!editable?'<p class="hint">Iniciá o continuá el entrenamiento de este día para agregar un ejercicio.</p>':`<form id="extra-form"><label>Nombre del ejercicio<input name="extraName" required maxlength="100" placeholder="Ej.: Curl en polea"></label><div class="extra-fields"><label>Series<input type="number" name="sets" min="1" max="10" value="3" required></label><label>Reps mínimas<input type="number" name="low" min="1" max="99" value="8" required></label><label>Reps máximas<input type="number" name="high" min="1" max="99" value="12" required></label><label>RIR objetivo por serie<input type="number" name="rir" min="0" max="10" value="2" required></label><label>Descanso · segundos<input type="number" name="rest" min="1" max="600" value="90" required></label></div><button class="secondary" type="submit" style="margin-top:12px">Agregar a esta sesión</button></form>`}</details></div>`}
function removeExtra(ei){if(!running||!session||session.day!==active||ei<plannedCounts[active])return;if(!confirm('¿Quitar este ejercicio extra y sus series de la sesión actual? El historial guardado se conserva.'))return;const next=JSON.parse(JSON.stringify(extras));next[active][ei-plannedCounts[active]]=null;try{localStorage.setItem(EXTRA_KEY,JSON.stringify(next))}catch(_){alert('No se pudo guardar el cambio.');return}extras=next;Object.keys(localStorage).filter(k=>k.startsWith(`draft-${active}-${ei}-`)).forEach(k=>localStorage.removeItem(k));if(rest&&rest.key.startsWith(`draft-${active}-${ei}-`))clearRest();syncExtras();render()}
let active=+(localStorage.activeDay||0), viewingHistory=false;
const SESSION_KEY='marcos-training-session-v1';
let session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'), running=false;
if(session&&(!Number.isInteger(session.day)||!routine[session.day]||!Number.isFinite(session.startedAt)))session=null;
if(!routine[active])active=0;
const MACHINES_KEY='marcos-training-machines-v1';
let machines=JSON.parse(localStorage.getItem(MACHINES_KEY)||'{}');
function machineConfig(day,ei){return machines[`${day}-${ei}`]||{selected:'original',options:[]}}
function machineId(day,ei){if(routine[day].ex[ei]?.extra)return 'original';return machineConfig(day,ei).selected}
function machineLabel(day,ei){const c=machineConfig(day,ei);return c.selected==='original'?routine[day].ex[ei][0]:(c.options.find(o=>o.id===c.selected)||{}).name||routine[day].ex[ei][0]}
function draftKey(day,ei,si){const id=machineId(day,ei);return `draft-${day}-${ei}-${si}`+(id==='original'?'':`-machine-${id}`)}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function chooseMachine(ei,id){const c=machineConfig(active,ei);if(id!=='original'&&!c.options.some(o=>o.id===id))return;c.selected=id;machines[`${active}-${ei}`]=c;localStorage.setItem(MACHINES_KEY,JSON.stringify(machines));render()}
function addMachine(ei){const name=prompt('Nombre de la máquina o variante (por ejemplo: Press en máquina Technogym)');if(!name||!name.trim())return;const label=name.trim().slice(0,100),c=machineConfig(active,ei);const existing=c.options.find(o=>o.name.toLocaleLowerCase()===label.toLocaleLowerCase());if(existing){chooseMachine(ei,existing.id);return}if(label.toLocaleLowerCase()===routine[active].ex[ei][0].toLocaleLowerCase()){chooseMachine(ei,'original');return}const id=crypto.randomUUID();c.options.push({id,name:label});machines[`${active}-${ei}`]=c;chooseMachine(ei,id)}
function machineControls(ei){if(routine[active].ex[ei].extra)return `<div class="meta">Ejercicio extra · fuera de la planificación</div>${running&&session&&session.day===active?`<button class="secondary danger" onclick="removeExtra(${ei})">Quitar extra</button>`:''}`;const c=machineConfig(active,ei);return `<div class="meta" style="margin-top:10px"><label>Máquina / variante <select aria-label="Máquina o variante de ${escapeHtml(routine[active].ex[ei][0])}" style="display:block;width:100%;max-width:100%;padding:10px;margin:6px 0" onchange="chooseMachine(${ei},this.value)"><option value="original">${escapeHtml(routine[active].ex[ei][0])} (original)</option>${c.options.map(o=>`<option value="${o.id}" ${c.selected===o.id?'selected':''}>${escapeHtml(o.name)}</option>`).join('')}</select></label><button class="secondary" onclick="addMachine(${ei})">+ Agregar alternativa</button><p>Pesos y comparación separados por máquina. Se conservan las series al cambiar; al finalizar se guarda la alternativa seleccionada.</p></div>`}
function hasDraft(day){return Object.keys(localStorage).filter(k=>k.startsWith(`draft-${day}-`)).some(k=>{const v=JSON.parse(localStorage.getItem(k)||'{}');return v.done||v.kg||v.reps||v.rir})}
function canEdit(key){return running&&session&&session.day===active&&key.startsWith(`draft-${session.day}-`)}
function saveSession(){if(session)localStorage.setItem(SESSION_KEY,JSON.stringify(session));else localStorage.removeItem(SESSION_KEY)}
function updateTimer(){const elapsed= session?Math.max(0,Math.floor((Date.now()-session.startedAt)/1000)):0;$('#timer').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0')}
function sessionAction(){
 if(session){active=session.day;localStorage.activeDay=active;running=true;}
 else{session={day:active,startedAt:Date.now()};saveSession();running=true;}
 unlockAudio();viewingHistory=false;hist.classList.add('hidden');train.classList.remove('hidden');$('#historyBtn').textContent='Historial';renderTabs();render();updateTimer();tickRest();
}
function clearDraft(day){delete extras[day];localStorage.setItem(EXTRA_KEY,JSON.stringify(extras));syncExtras();Object.keys(localStorage).filter(k=>k.startsWith(`draft-${day}-`)).forEach(k=>localStorage.removeItem(k));if(rest&&rest.key.startsWith(`draft-${day}-`))clearRest()}
function discardSession(){
 if(session&&session.day!==active)return;
 if(!confirm('¿Descartar esta sesión y sus datos cargados? No se guardará en el historial.'))return;
 clearDraft(active);session=null;running=false;saveSession();render();updateTimer();
}

const $=s=>document.querySelector(s), tabs=$('#tabs'), train=$('#train'), hist=$('#history');
function history(){return JSON.parse(localStorage.workouts||'[]')} function saveHistory(h){localStorage.workouts=JSON.stringify(h)}
// V1 storage keys and record shapes are deliberately unchanged.
function lastFor(name,id='original'){for(const w of history()) for(const e of w.exercises||[]) if(e.name===name && (e.machineId||'original')===id && (e.sets||[]).some(s=>s&&s.done)) return e; return null}
function number(v){if(v===undefined||v===null||String(v).trim()==='')return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)&&n>=0?n:null}
function range(v){return String(v).split(/[–-]/).map(Number)}
function validSet(s){return s&&s.done&&number(s.kg)!==null&&number(s.reps)>0&&Number.isInteger(number(s.reps))&&number(s.rir)!==null}
function recommendation(e,sets,last){
 if(!sets.every(s=>s&&s.done))return '';
 if(!sets.every(validSet))return 'Completá kg, reps y RIR reales para calcular la progresión.';
 const [lo,hi]=range(e[2]);
 const targets=e[3].map(range);
 const tooHard=sets.some((s,i)=>number(s.reps)<lo||number(s.rir)<targets[i][0]);
 const previous=last&&last.sets;
 const comparable=previous&&sets.every((s,i)=>validSet(previous[i]));
 let comparison='Sin sesión anterior completa comparable.';
 if(comparable){
  const sameLoads=sets.every((s,i)=>number(s.kg)===number(previous[i].kg));
  const delta=sets.reduce((n,s,i)=>n+number(s.reps)-number(previous[i].reps),0);
  comparison=sameLoads?`Misma carga: ${delta>0?'+':''}${delta} reps totales vs. anterior.`:'Carga distinta de la anterior; comparación por serie arriba.';
 }
 let advice=tooHard?'↓ Revisar carga':sets.every((s,i)=>number(s.reps)>=hi&&number(s.rir)>=targets[i][0])?'↑ Subir carga':'→ Mantener carga e intentar más reps';
 return `${advice} · ${comparison}`;
}
let rest=JSON.parse(localStorage.getItem('marcos-v2-rest')||'null'), audioContext;
function unlockAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioContext)audioContext=new AC();audioContext.resume().catch(()=>{});const o=audioContext.createOscillator(),g=audioContext.createGain();g.gain.value=0;o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.01)}catch(_){}}
function beep(){try{if(!audioContext||audioContext.state!=='running')return;[0,.3,.6].forEach(t=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),at=audioContext.currentTime+t;o.frequency.value=880;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.18,at+.02);g.gain.exponentialRampToValueAtTime(.001,at+.2);o.connect(g);g.connect(audioContext.destination);o.start(at);o.stop(at+.21)})}catch(_){}}
function restSeconds(label){const values=label.replace('½','.5').match(/\d+(?:\.\d+)?/g).map(Number);return Math.max(...values)*(label.includes('min')?60:1)}
function saveRest(){if(rest)localStorage.setItem('marcos-v2-rest',JSON.stringify(rest));else localStorage.removeItem('marcos-v2-rest')}
function startRest(key,e){unlockAudio();rest={key,name:e[0],endsAt:Date.now()+restSeconds(e[4])*1000,notified:false};saveRest();tickRest()}
function clearRest(){rest=null;saveRest();tickRest()}
function tickRest(){const el=$('#rest');if(!rest||!session||!running){el.className='rest hidden';el.textContent='';return}const seconds=Math.max(0,Math.ceil((rest.endsAt-Date.now())/1000));el.className='rest'+(seconds?'':' ready');el.textContent=seconds?`Descanso · ${rest.name} · ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`:`✓ Descanso terminado · ${rest.name}`;if(seconds){const small=document.createElement('small');small.textContent='Aviso sonoro con la app abierta, si el dispositivo lo permite.';el.appendChild(small)}if(!seconds&&!rest.notified&&document.visibilityState!=='hidden'){rest.notified=true;saveRest();beep();if(navigator.vibrate)navigator.vibrate([200,100,200])}}
document.addEventListener('visibilitychange',tickRest);window.addEventListener('pageshow',tickRest);setInterval(tickRest,250);

function renderTabs(){tabs.innerHTML=routine.map((d,i)=>`<button class='tab ${i===active?'active':''}' onclick='selectDay(${i})'>${d.day}</button>`).join('')}
function selectDay(i){active=i;localStorage.activeDay=i;viewingHistory=false;hist.classList.add('hidden');train.classList.remove('hidden');$('#historyBtn').textContent='Historial';renderTabs();render()}
function render(){let d=routine[active],editable=running&&session&&session.day===active;$('#finishBtn').textContent=editable?'Finalizar entrenamiento':session?'Continuar entrenamiento':hasDraft(active)?'Continuar borrador':'Iniciar entrenamiento';let html=`<div class='card'><div class='row'><div><b>${d.day} — ${d.name}</b><div class='hint'>Objetivo: 60–75 min · respetar RIR</div></div>${(!session||session.day===active)&&(session||hasDraft(active))?`<button class='secondary danger' onclick='discardSession()'>Descartar sesión</button>`:''}</div><div class='hint' style='margin-top:8px'>${editable?'Sesión en curso. Cerrar la app conserva los datos y el tiempo transcurrido.':session?'Tenés una sesión pendiente. Tocá Continuar entrenamiento para retomarla.':hasDraft(active)?'Borrador anterior conservado. Continuar borrador inicia el reloj ahora; la duración anterior no está disponible.':'Podés consultar sin registrar datos. Tocá Iniciar entrenamiento cuando estés listo.'}</div></div>`;
d.ex.forEach((e,ei)=>{if(e.removed)return;let last=lastFor(e[0],machineId(active,ei));html+=`<div class='card exercise'><h3>${escapeHtml(e[0])}</h3>${machineControls(ei)}<div class='meta'>${e[1]} series · ${e[2]} reps · descanso ${e[4]}</div><div class='sets'><div class='setrow head'><div>#</div><div>KG</div><div>REPS</div><div>RIR</div><div>✓</div></div>`;for(let s=0;s<e[1];s++){let key=draftKey(active,ei,s),v=JSON.parse(localStorage.getItem(key)||'{}');html+=`<div class='setrow'><div>${s+1}</div><input ${editable?'':'disabled'} inputmode='decimal' placeholder='kg' value='${escapeHtml(v.kg||'')}' oninput="upd('${key}','kg',this.value)"><input ${editable?'':'disabled'} inputmode='numeric' placeholder='reps' value='${escapeHtml(v.reps||'')}' oninput="upd('${key}','reps',this.value)"><input ${editable?'':'disabled'} inputmode='decimal' placeholder='${e[3][s]}' value='${escapeHtml(v.rir||'')}' oninput="upd('${key}','rir',this.value)"><button ${editable?'':'disabled'} class='check ${v.done?'done':''}' onclick="done('${key}')">${v.done?'✓':'○'}</button></div><div class='previous'>${last&&last.sets[s]&&last.sets[s].done?`Anterior: ${escapeHtml(last.sets[s].kg||'—')} kg × ${escapeHtml(last.sets[s].reps||'—')} · RIR ${escapeHtml(last.sets[s].rir||'—')}`:'Anterior: sin serie completada comparable'}</div>`}html+=`</div><div class='progress' id='progress-${ei}' role='status'>${recommendation(e,Array.from({length:e[1]},(_,si)=>JSON.parse(localStorage.getItem(draftKey(active,ei,si))||'{}')),last)}</div></div>`});train.innerHTML=html+extraForm(editable)}
train.addEventListener('submit',event=>{if(event.target.id!=='extra-form')return;event.preventDefault();if(!running||!session||session.day!==active)return;const f=new FormData(event.target),name=String(f.get('extraName')).trim(),sets=Number(f.get('sets')),lo=Number(f.get('low')),hi=Number(f.get('high')),rir=Number(f.get('rir')),seconds=Number(f.get('rest'));if(!name||name.length>100||![sets,lo,hi,rir,seconds].every(Number.isInteger)||sets<1||sets>10||lo<1||hi<lo||hi>99||rir<0||rir>10||seconds<1||seconds>600){alert('Revisá los valores: series 1–10, reps 1–99, máximo mayor o igual al mínimo, RIR 0–10 y descanso 1–600 segundos.');return}if(routine[active].ex.some(e=>!e.removed&&e[0].toLocaleLowerCase()===name.toLocaleLowerCase())){alert('Ya hay un ejercicio con ese nombre en este día. Usá otro nombre para distinguir la variante.');return}const next=JSON.parse(JSON.stringify(extras));next[active]=next[active]||[];if(next[active].length>=30){alert('Alcanzaste el límite de 30 incorporaciones en esta sesión.');return}next[active].push([name,sets,`${lo}–${hi}`,Array(sets).fill(String(rir)),`${seconds} s`]);try{localStorage.setItem(EXTRA_KEY,JSON.stringify(next))}catch(_){alert('No se pudo guardar el ejercicio. Revisá el almacenamiento.');return}extras=next;syncExtras();render();});
window.upd=(k,f,v)=>{if(!canEdit(k))return;let x=JSON.parse(localStorage.getItem(k)||'{}');x[f]=v;localStorage.setItem(k,JSON.stringify(x));const ei=Number(k.split('-')[2]),e=routine[active].ex[ei];$('#progress-'+ei).textContent=recommendation(e,Array.from({length:e[1]},(_,si)=>JSON.parse(localStorage.getItem(draftKey(active,ei,si))||'{}')),lastFor(e[0],machineId(active,ei)))};window.done=k=>{if(!canEdit(k))return;let x=JSON.parse(localStorage.getItem(k)||'{}');x.done=!x.done;localStorage.setItem(k,JSON.stringify(x));if(x.done)startRest(k,routine[active].ex[Number(k.split('-')[2])]);else if(rest&&rest.key===k)clearRest();render()};

function finish(){if(!session||!running||session.day!==active)return;if(!confirm('¿Finalizar y guardar este entrenamiento en el historial?'))return;let d=routine[active],exercises=[],completed=0,total=0;d.ex.forEach((e,ei)=>{if(e.removed)return;let sets=[];for(let s=0;s<e[1];s++){let v=JSON.parse(localStorage.getItem(draftKey(active,ei,s))||'{}');sets.push(v);total++;if(v.done)completed++}exercises.push({name:e[0],extra:!!e.extra,machineId:machineId(active,ei),machineName:machineLabel(active,ei),sets})});if(!completed&&!confirm('No marcaste series como completadas. ¿Guardar igualmente?'))return;let mins=Math.max(1,Math.round((Date.now()-session.startedAt)/60000));let h=history();h.unshift({date:new Date().toISOString(),day:d.day,name:d.name,minutes:mins,completed,total,exercises});saveHistory(h);clearDraft(active);alert(`Entrenamiento guardado: ${mins} min · ${completed}/${total} series.`);if(rest&&rest.key.startsWith(`draft-${active}-`))clearRest();session=null;running=false;saveSession();render();updateTimer();if(viewingHistory)renderHistory()}
function renderHistory(){let h=history();hist.innerHTML=`<div class='card'><h3 style='margin-top:0'>Historial</h3>${h.length?h.map(w=>`<div class='history-item'><b>${new Date(w.date).toLocaleDateString('es-AR')} · ${escapeHtml(w.day)} — ${escapeHtml(w.name)}</b><div class='meta'>${escapeHtml(w.minutes)} min · ${escapeHtml(w.completed)}/${escapeHtml(w.total)} series</div>${w.exercises.map(e=>`<div class='hint' style='margin-top:5px'><b>${escapeHtml(e.name)}${e.extra?' (extra)':''}${e.machineId&&e.machineId!=='original'?` — ${escapeHtml(e.machineName)}`:''}:</b> ${e.sets.filter(s=>s.kg||s.reps).map(s=>`${escapeHtml(s.kg||'-')} kg × ${escapeHtml(s.reps||'-')} @ RIR ${escapeHtml(s.rir||'-')}`).join(' · ')}</div>`).join('')}</div>`).join(''):`<p class='hint'>Todavía no hay entrenamientos guardados.</p>`}</div>`}
$('#finishBtn').onclick=()=>{if(running&&session&&session.day===active)finish();else sessionAction()};$('#historyBtn').onclick=()=>{viewingHistory=!viewingHistory;if(viewingHistory){train.classList.add('hidden');hist.classList.remove('hidden');renderHistory();$('#historyBtn').textContent='Volver'}else{hist.classList.add('hidden');train.classList.remove('hidden');$('#historyBtn').textContent='Historial'}};
setInterval(updateTimer,1000);renderTabs();render();updateTimer();tickRest();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script><script src='nutrition.js'></script></body></html>
